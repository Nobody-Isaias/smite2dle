name: Diagnose SWA deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CDN: https://swalocaldeployv2-bndtgugjgqc3dhdx.b01.azurefd.net/downloads

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Compare StaticSitesClient builds
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          S="$GITHUB_STEP_SUMMARY"

          try_build () {
            local label="$1" build="$2"
            echo "### $label ($build)" >> "$S"
            echo '```' >> "$S"
            curl -sSL "$CDN/$build/linux/StaticSitesClient" -o "ssc-$build" || {
              echo "download failed" >> "$S"; echo '```' >> "$S"; return; }
            chmod +x "ssc-$build"
            set +e
            env DEPLOYMENT_ACTION=upload DEPLOYMENT_PROVIDER=SwaCli \
                SKIP_APP_BUILD=true SKIP_API_BUILD=true \
                DEPLOYMENT_ENVIRONMENT=production \
                REPOSITORY_BASE="$GITHUB_WORKSPACE" \
                DEPLOYMENT_TOKEN="$TOKEN" \
                APP_LOCATION="$GITHUB_WORKSPACE/dist" \
                "./ssc-$build" upload > "b-$build.log" 2>&1
            local rc=$?
            set -e
            echo "exit=$rc" >> "$S"
            tail -14 "b-$build.log" >> "$S"
            echo '```' >> "$S"
          }

          try_build "latest  2026-08-05" d3c91588e7e47f64005e6ccafddb0c02eccf9f43
          try_build "stable  2026-05-21" 689a6c1fe8fc32f40348cc41223a7e9d83dd43d2
          try_build "backup  2026-01-13" 08e29138cd3dcda4ffda6d587aa580028110c1c7

name: Diagnose SWA deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Bisect the environment
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          S="$GITHUB_STEP_SUMMARY"

          # let the CLI fetch the binary for us
          npx --yes @azure/static-web-apps-cli@2 deploy ./dist --env production \
            --deployment-token "$TOKEN" > /dev/null 2>&1 || true
          BIN=$(find "$HOME/.swa" -name 'StaticSitesClient*' -type f ! -name '*.json' | head -1)
          chmod +x "$BIN"

          COMMON="DEPLOYMENT_ACTION=upload DEPLOYMENT_PROVIDER=SwaCli SKIP_APP_BUILD=true SKIP_API_BUILD=true DEPLOYMENT_ENVIRONMENT=production"

          run_variant () {
            local name="$1"; shift
            echo "### $name" >> "$S"
            echo '```' >> "$S"
            set +e
            "$@" > v.log 2>&1
            local rc=$?
            set -e
            echo "exit=$rc" >> "$S"
            tail -12 v.log >> "$S"
            echo '```' >> "$S"
          }

          # A: full runner environment (baseline)
          run_variant "A - full runner env" \
            env $COMMON \
              REPOSITORY_BASE="$GITHUB_WORKSPACE" \
              DEPLOYMENT_TOKEN="$TOKEN" \
              APP_LOCATION="$GITHUB_WORKSPACE/dist" \
              "$BIN" upload

          # B: same, but GitHub Actions markers removed
          run_variant "B - GITHUB_* markers unset" \
            env -u GITHUB_ACTIONS -u GITHUB_WORKFLOW -u GITHUB_RUN_ID -u GITHUB_REPOSITORY \
                -u GITHUB_REF -u GITHUB_SHA -u GITHUB_EVENT_NAME -u GITHUB_WORKSPACE \
                -u GITHUB_HEAD_REF -u GITHUB_BASE_REF -u GITHUB_ACTOR -u CI \
                $COMMON \
              REPOSITORY_BASE="$RUNNER_TEMP" \
              DEPLOYMENT_TOKEN="$TOKEN" \
              APP_LOCATION="$GITHUB_WORKSPACE/dist" \
              "$BIN" upload

          # C: completely scrubbed environment
          run_variant "C - scrubbed env -i" \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" \
                $COMMON \
              REPOSITORY_BASE="$RUNNER_TEMP" \
              DEPLOYMENT_TOKEN="$TOKEN" \
              APP_LOCATION="$GITHUB_WORKSPACE/dist" \
              "$BIN" upload

          echo "### Any log files the binary wrote" >> "$S"
          echo '```' >> "$S"
          find "$HOME" "$RUNNER_TEMP" /tmp -maxdepth 3 -iname '*staticsites*log*' -o -maxdepth 3 -iname '*.swa*log*' 2>/dev/null | head >> "$S" || true
          echo '```' >> "$S"

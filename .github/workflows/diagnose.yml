name: Diagnose SWA deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Collect diagnostics
        continue-on-error: true
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          S="$GITHUB_STEP_SUMMARY"

          echo "## Environment" >> "$S"
          echo '```' >> "$S"
          grep PRETTY /etc/os-release >> "$S" 2>&1 || true
          ldd --version | head -1 >> "$S" 2>&1 || true
          echo "libicu: $(ldconfig -p | grep -c icu)" >> "$S" 2>&1 || true
          echo '```' >> "$S"

          echo "## swa deploy (expected to fail)" >> "$S"
          echo '```' >> "$S"
          npx --yes @azure/static-web-apps-cli@2 deploy ./dist --env production > swa.log 2>&1 || true
          tail -25 swa.log >> "$S"
          echo '```' >> "$S"

          BIN=$(find "$HOME/.swa" -name 'StaticSitesClient*' -type f ! -name '*.json' | head -1)
          echo "## Binary" >> "$S"
          echo '```' >> "$S"
          echo "path: $BIN" >> "$S"
          if [ -n "$BIN" ]; then
            chmod +x "$BIN"
            file "$BIN" >> "$S" 2>&1 || true
            echo "--- ldd ---" >> "$S"
            ldd "$BIN" >> "$S" 2>&1 || echo "(ldd non-zero)" >> "$S"
          fi
          echo '```' >> "$S"

          echo "## Direct run, VERBOSE=true" >> "$S"
          echo '```' >> "$S"
          if [ -n "$BIN" ]; then
            env \
              DEPLOYMENT_ACTION=upload \
              DEPLOYMENT_PROVIDER=SwaCli \
              REPOSITORY_BASE="$GITHUB_WORKSPACE" \
              SKIP_APP_BUILD=true \
              SKIP_API_BUILD=true \
              DEPLOYMENT_TOKEN="$SWA_CLI_DEPLOYMENT_TOKEN" \
              APP_LOCATION="$GITHUB_WORKSPACE/dist" \
              CONFIG_FILE_LOCATION="$GITHUB_WORKSPACE/dist" \
              DEPLOYMENT_ENVIRONMENT=production \
              VERBOSE=true \
              "$BIN" upload > direct.log 2>&1 || echo "exit=$?" >> "$S"
            tail -60 direct.log >> "$S"
          fi
          echo '```' >> "$S"

          echo "## Reachability of the deploy API" >> "$S"
          echo '```' >> "$S"
          curl -sS -o /dev/null -w 'proud-forest host: %{http_code} in %{time_total}s\n' \
            https://proud-forest-0ae525d03.7.azurestaticapps.net/ >> "$S" 2>&1 || true
          curl -sS -o /dev/null -w 'westeurope api: %{http_code} in %{time_total}s\n' \
            https://westeurope.api.azurestaticapps.net/ >> "$S" 2>&1 || true
          echo '```' >> "$S"

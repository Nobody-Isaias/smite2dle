name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    # StaticSitesClient is a .NET single-file binary that fails with an opaque
    # "unknown exception" on ubuntu-24.04 (the current ubuntu-latest).
    runs-on: ubuntu-22.04
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SWA_ENV: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
        run: |
          npx --yes @azure/static-web-apps-cli@2 deploy ./dist --env "$SWA_ENV"

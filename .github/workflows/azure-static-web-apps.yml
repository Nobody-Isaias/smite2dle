name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SWA_ENV: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
        run: |
          # StaticSitesClient puts the token straight into an Authorization
          # header, so any stray whitespace makes it throw
          # "System.FormatException: The format of value 'token ...' is invalid"
          # which older builds report only as "An unknown exception has occurred".
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')

          npx --yes @azure/static-web-apps-cli@2 deploy ./dist \
            --env "$SWA_ENV" \
            --deployment-token "$TOKEN"
